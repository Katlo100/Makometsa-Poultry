<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Products – Makometsa Poultry</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

</head>

<body>

<div id="introPopup" class="intro-popup">
  <img src="Product.popup.jpeg" class="intro-img">
  <div class="intro-text">
    <h1>Makometsa Poultry</h1>
    <p>Premium poultry at unbeatable prices</p>
  </div>
</div>

<header class="hero-header" style="background-image:url('Product.popup.jpeg')">

<nav class="hero-navbar">
<div class="nav-container">
  <a href="index.html" class="nav-logo">Makometsa</a>

  <div id="hamburger" class="hamburger">
    <span></span><span></span><span></span>
  </div>

  <ul id="navLinks" class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="products.html" class="active">Products</a></li>
    <li><a href="Order.html">Order</a></li>
  </ul>
</div>
</nav>

<div class="hero-content">
  <h1>Our Products</h1>
  <p>Fresh, healthy poultry products</p>
  <a href="order.html" class="hero-btn">Order Now</a>
</div>

</header>

<div id="cartIcon" class="cart-icon">
  🛒 <span id="cartCount">0</span>
</div>

<div id="cartSidebar" class="cart-sidebar">
  <span id="closeCart">×</span>
  <h3>Your Cart</h3>
  <div id="cartItems"></div>
  <strong>Total: P <span id="cartTotal">0</span></strong>
  <a href="order.html" class="btn btn-success w-100 mt-3">Checkout</a>
</div>

<section class="container mt-5">

<div class="row">

<div class="col-4">
  <div class="product-card card text-center">
    <img src="Broilers.jpeg">
    <h5>Broiler Chickens</h5>
    <p class="price-tag">P80</p>
    <button class="btn btn-success add-cart" data-name="Broiler" data-price="80">Add to Cart</button>
  </div>
</div>

<div class="col-4">
  <div class="product-card card text-center">
    <img src="Layers.jpeg">
    <h5>Eggs</h5>
    <p class="price-tag">P14</p>
    <button class="btn btn-success add-cart" data-name="Eggs" data-price="14">Add to Cart</button>
  </div>
</div>

<div class="col-4">
  <div class="product-card card text-center">
    <img src="Chicken maure.jpeg">
    <h5>Chicken Manure</h5>
    <p class="price-tag">P150</p>
    <button class="btn btn-success add-cart" data-name="Manure" data-price="150">Add to Cart</button>
  </div>
</div>

</div>

</section>

<footer class="footer">
  © 2026 Makometsa Poultry
</footer>

<script src="app.js"></script>

</body>
</html>
