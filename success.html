<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Successful – Makometsa Poultry</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link 
  rel="stylesheet" 
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  
<style>
    body {
        background: #035e03;
        font-family: "Arial", sans-serif;
        overflow-x: hidden;
        text-align: center;
        padding-top: 100px;
    }

    /* ✅ Success Box Animation */
    .success-box {
        background: rgb(188, 229, 140);
        padding: 50px 30px;
        border-radius: 20px;
        box-shadow: 0px 6px 25px rgba(0,0,0,0.1);
        width: 90%;
        max-width: 500px;
        margin: auto;
        position: relative;
        animation: fadeIn 0.9s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(30px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* ✅ Checkmark Animation */
    .checkmark {
        font-size: 90px;
        color: #0a5c0a;
        animation: pop 0.6s ease-out forwards;
    }

    @keyframes pop {
        0%   { transform: scale(0.5); opacity: 0; }
        70%  { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); }
    }

    /* ✅ Confetti Animation */
    .confetti {
        position: fixed;
        top: -10px;
        width: 10px;
        height: 10px;
        background: #0a5c0a;
        opacity: 0.8;
        animation: fall 3s linear infinite;
        border-radius: 50%;
    }

    @keyframes fall {
        0%   { transform: translateY(0) rotate(0deg); }
        100% { transform: translateY(120vh) rotate(360deg); }
    }

    /* ✅ Button */
    .btn-home {
        margin-top: 25px;
        padding: 12px 30px;
        background: #0a5c0a;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        font-size: 18px;
        font-weight: 600;
        transition: 0.3s;
        display: inline-block;
    }

    .btn-home:hover {
        background: #087108;
        transform: translateY(-3px);
    }

</style>
</head>

<body>

<!-- ✅ Floating Confetti (JavaScript Creates More Automatically) -->
<div id="confetti-container"></div>

<div class="success-box">
    <div class="checkmark">✅</div>
    <h1 class="mt-3 fw-bold">Order Submitted Successfully!</h1>
    <p class="lead">Thank you for choosing Makometsa Poultry.<br>Our team will contact you shortly.</p>

    <a href="index.html" class="btn-home">Return Home</a>
</div>

<script>
/* ✅ Generate Confetti Animation */
function createConfetti() {
    const confetti = document.createElement("div");
    confetti.classList.add("confetti");

    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.backgroundColor = ["#0a5c0a", "#5ec25e", "#b3ffb3"][Math.floor(Math.random()*3)];
    confetti.style.animationDuration = (Math.random() * 2 + 2) + "s";

    document.getElementById("confetti-container").appendChild(confetti);

    setTimeout(() => confetti.remove(), 3000);
}

setInterval(createConfetti, 180);
</script>

</body>
</html>
